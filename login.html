<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>লগইন — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Bengali',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <div class="bg-white rounded-3xl shadow-2xl p-7">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🧵</div>
      <h1 class="text-2xl font-extrabold">লগইন</h1>
      <p class="text-gray-500 text-xs mt-1">Shop ID অথবা মোবাইল নাম্বার দিয়ে</p>
    </div>

    <form id="loginForm" class="space-y-3" autocomplete="off">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">Shop ID অথবা মোবাইল</label>
        <input id="inpIdentifier" required placeholder="SHOP-XXXXXX অথবা 01XXXXXXXXX"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">
          ইউজারনেম <span class="text-gray-400 font-normal">(অ্যাডমিন হলে খালি রাখুন)</span>
        </label>
        <input id="inpUsername" placeholder="যেমন: karim" autocomplete="off"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">পাসওয়ার্ড</label>
        <input id="inpPassword" type="password" required autocomplete="current-password"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <button id="btnLogin" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-blue-500/30 active:scale-[.98] transition disabled:opacity-60">
        লগইন করুন
      </button>
    </form>

    <div class="mt-5 text-center">
      <a href="register.html" class="text-sm text-blue-600 font-semibold hover:underline">
        নতুন দোকান খুলবেন? রেজিস্ট্রেশন করুন →
      </a>
    </div>

    <div class="mt-4 pt-4 border-t border-gray-100 text-center">
      <a href="index.html" class="text-xs text-gray-500 hover:underline">← হোম পেজ</a>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
/* ---------- LOGIN ---------- */
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  const raw = document.getElementById('inpIdentifier').value.trim();
  const username = document.getElementById('inpUsername').value.trim().toLowerCase().replace(/\s+/g, '');
  const password = document.getElementById('inpPassword').value;

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = 'অপেক্ষা করুন...';

  try {
    let shopId = null;

    // Detect phone vs shop ID
    const digitsOnly = raw.replace(/\D/g, '');
    if (digitsOnly.length >= 10 && !raw.toUpperCase().startsWith('SHOP')) {
      const phone = TP.normalizePhone(raw);
      const snap = await TP.db.collection('phoneIndex').doc(phone).get();
      if (!snap.exists) throw new Error('এই মোবাইল নাম্বার রেজিস্টার্ড নেই');
      shopId = snap.data().shopId;
    } else {
      shopId = raw.toUpperCase();
      const snap = await TP.db.collection('shops').doc(shopId).get();
      if (!snap.exists) throw new Error('এই শপ আইডি পাওয়া যায়নি');
    }

    // Determine login email
    const email = username ? TP.salesmanEmail(shopId, username) : TP.adminEmail(shopId);

    // Sign in — onAuthStateChanged will handle redirect
    await TP.auth.signInWithEmailAndPassword(email, password);

  } catch (err) {
    console.error(err);
    let msg = err.message || 'লগইন ব্যর্থ';
    if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(err.code)) {
      msg = 'ইউজারনেম বা পাসওয়ার্ড ভুল';
    }
    if (err.code === 'auth/too-many-requests') msg = 'অনেকবার চেষ্টা — কিছুক্ষণ পরে';
    if (err.code === 'auth/network-request-failed') msg = 'ইন্টারনেট নেই';
    TP.toast(msg, 'error');
    btn.disabled = false;
    btn.textContent = 'লগইন করুন';
  }
});

/* ---------- AUTO REDIRECT + FORCE PASSWORD CHANGE ---------- */
TP.auth.onAuthStateChanged(async user => {
  if (!user) {
    document.getElementById('btnLogin').disabled = false;
    document.getElementById('btnLogin').textContent = 'লগইন করুন';
    return;
  }
  try {
    const userDoc = await TP.db.collection('users').doc(user.uid).get();
    if (!userDoc.exists) { await TP.auth.signOut(); return; }
    const userData = userDoc.data();

    if (userData.mustChangePassword) {
      // Show force-password modal
      showForcePassword(user, userData);
      return;
    }

    // Redirect
    location.href = userData.role === 'admin' ? 'admin.html' : 'salesman.html';
  } catch (err) {
    console.error(err);
    TP.toast('লগইন ব্যর্থ', 'error');
  }
});

/* ---------- FORCE PASSWORD CHANGE ---------- */
function showForcePassword(user, userData) {
  const existing = document.getElementById('forcePwModal');
  if (existing) return;

  const modal = document.createElement('div');
  modal.id = 'forcePwModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:24px;max-width:420px;width:100%;padding:28px;font-family:'Noto Sans Bengali',sans-serif">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px;margin-bottom:8px">🔐</div>
        <h2 style="font-size:20px;font-weight:800;margin:0">পাসওয়ার্ড পরিবর্তন করুন</h2>
        <p style="color:#6b7280;font-size:12px;margin:6px 0 0">
          টেম্পোরারি পাসওয়ার্ড দিয়ে লগইন করেছেন।<br>নিরাপত্তার জন্য নতুন পাসওয়ার্ড সেট করুন।
        </p>
      </div>
      <input id="fpNew1" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"
        style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:14px;margin-bottom:10px;box-sizing:border-box">
      <input id="fpNew2" type="password" placeholder="পাসওয়ার্ড আবার লিখুন"
        style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:14px;margin-bottom:16px;box-sizing:border-box">
      <button id="fpSubmit"
        style="width:100%;background:#2563eb;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        পরিবর্তন করুন
      </button>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById('fpSubmit').addEventListener('click', async () => {
    const n1 = document.getElementById('fpNew1').value;
    const n2 = document.getElementById('fpNew2').value;
    if (n1.length < 6) { TP.toast('কমপক্ষে ৬ অক্ষর', 'error'); return; }
    if (n1 !== n2)     { TP.toast('পাসওয়ার্ড মিলছে না', 'error'); return; }

    const btn = document.getElementById('fpSubmit');
    btn.disabled = true; btn.textContent = '...';

    try {
      await user.updatePassword(n1);
      await TP.db.collection('users').doc(user.uid).update({ mustChangePassword: false });
      TP.toast('পাসওয়ার্ড পরিবর্তিত', 'success');
      setTimeout(() => {
        location.href = userData.role === 'admin' ? 'admin.html' : 'salesman.html';
      }, 600);
    } catch (err) {
      console.error(err);
      let msg = 'পরিবর্তন ব্যর্থ';
      if (err.code === 'auth/requires-recent-login') msg = 'নিরাপত্তার জন্য আবার লগইন করুন';
      TP.toast(msg, 'error');
      btn.disabled = false; btn.textContent = 'পরিবর্তন করুন';
    }
  });
}
</script>
</body>
</html>
