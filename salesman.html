<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>সেলসম্যান — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Noto Sans Bengali',system-ui,sans-serif; }
  input,select,textarea,button{ font-family:inherit; }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .slide-up{animation:slideUp .25s cubic-bezier(.2,.9,.3,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .2s ease}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hide{display:none !important}
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="loadingScreen" class="fixed inset-0 bg-green-600 flex items-center justify-center z-[999]">
  <div class="text-white text-center">
    <div class="text-6xl mb-3">🧵</div>
    <div class="text-lg font-bold">লোড হচ্ছে...</div>
  </div>
</div>

<div id="app" class="hide min-h-screen">
  <header class="fixed top-0 inset-x-0 h-14 bg-green-600 text-white flex items-center px-2 z-40 shadow-md">
    <button id="menuBtn" class="p-2 w-11 h-11 flex items-center justify-center rounded-lg active:bg-white/20">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="pageTitle" class="flex-1 text-lg font-bold ml-1 truncate">POS</h1>
    <div class="text-right leading-tight pr-2">
      <div id="userName" class="text-sm font-semibold truncate max-w-[120px]"></div>
      <div class="text-[10px] opacity-80">সেলসম্যান</div>
    </div>
  </header>

  <div id="drawerBackdrop" class="hide fixed inset-0 bg-black/60 z-50"></div>
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-72 max-w-[85vw] bg-white z-[60] -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
    <div class="bg-green-600 text-white p-5">
      <div class="text-3xl mb-2">🧵</div>
      <div id="drawerShop" class="font-bold text-base truncate"></div>
      <div class="mt-1.5 inline-flex items-center gap-1 text-[11px] bg-white/20 px-2 py-1 rounded-md">
        <span>Shop:</span><span id="drawerShopId" class="font-mono font-bold"></span>
      </div>
      <div id="drawerUser" class="text-[11px] opacity-80 mt-1.5"></div>
    </div>
    <nav id="drawerNav" class="p-2"></nav>
  </aside>

  <main class="pt-14 pb-24 min-h-screen">
    <section id="page-pos" class="page"></section>
    <section id="page-my-sales" class="page hide"></section>
    <section id="page-products" class="page hide"></section>
    <section id="page-customers" class="page hide"></section>
    <section id="page-settings" class="page hide"></section>
  </main>

  <div id="cartBar" class="hide fixed bottom-[68px] inset-x-0 z-30 px-3 pointer-events-none">
    <button id="openCartBtn" class="w-full pointer-events-auto bg-green-600 text-white rounded-2xl py-3.5 px-5 flex items-center justify-between shadow-2xl active:scale-[.98] transition">
      <span class="text-sm font-semibold">🛒 কার্ট: <span id="cartCount">০</span></span>
      <span class="font-extrabold text-lg" id="cartTotal">৳০</span>
      <span class="text-sm font-semibold bg-white/20 px-3 py-1 rounded-lg">চেকআউট →</span>
    </button>
  </div>

  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 h-[68px] bg-white border-t border-gray-200 flex z-30 shadow-[0_-2px_10px_rgba(0,0,0,.05)]"></nav>
</div>

<div id="cartModal" class="hide fixed inset-0 z-[80] bg-black/60 items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[94vh] flex flex-col slide-up">
    <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
      <h2 class="font-bold text-lg">🛒 কার্ট</h2>
      <button data-close="cartModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="cartItems"></div>
    <div class="p-4 border-t bg-gray-50 flex-shrink-0 max-h-[60vh] overflow-y-auto" id="cartCheckout"></div>
  </div>
</div>

<div id="invoiceModal" class="hide fixed inset-0 z-[85] bg-black/70 items-center justify-center p-2">
  <div class="bg-white w-full max-w-2xl rounded-2xl max-h-[96vh] flex flex-col fade-in">
    <div class="p-3 border-b flex items-center justify-between">
      <h2 class="font-bold">🧾 ইনভয়েস</h2>
      <button data-close="invoiceModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="invoiceBody"></div>
    <div class="p-3 border-t flex gap-2">
      <button id="printThermal" class="flex-1 bg-gray-700 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 থার্মাল</button>
      <button id="printA4" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 A4</button>
      <button data-close="invoiceModal" class="flex-1 bg-gray-200 py-3 rounded-xl font-semibold text-sm active:scale-95">বন্ধ</button>
    </div>
  </div>
</div>

<iframe id="printFrame" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>

<script>
/* ============================================================
   SALESMAN PANEL
   ============================================================ */
const S = {
  profile: null, shopId: null,
  products: [], customers: [], sales: [],
  cart: [], saleType: 'retail', posSearch: '', posCategory: '',
  custMode: 'walkin', custId: '',
  discount: 0, paid: null, payMethod: 'cash',
  currentInvoice: null, currentPage: 'pos',
  unsubs: [],
};

function openModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.classList.remove('hide'); m.classList.add('flex');
}
function closeModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.classList.add('hide'); m.classList.remove('flex');
}
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-close]');
  if (btn) closeModal(btn.dataset.close);
});

(async function boot() {
  const profile = await TP.requireAuth();
  S.profile = profile;
  S.shopId = profile.shopId;
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderShell();
  setupListeners();
  goTo('pos');
})();

function renderShell() {
  document.getElementById('userName').textContent = S.profile.name;
  document.getElementById('drawerShop').textContent = S.profile.shop.shopName;
  document.getElementById('drawerShopId').textContent = S.shopId;
  document.getElementById('drawerUser').textContent = S.profile.name + ' • সেলসম্যান';
  updateBottomNav();
}

function setupListeners() {
  const sid = S.shopId;
  const shopRef = TP.db.collection('shops').doc(sid);
  S.unsubs.push(shopRef.collection('products').onSnapshot(s => {
    S.products = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  S.unsubs.push(shopRef.collection('customers').onSnapshot(s => {
    S.customers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  S.unsubs.push(shopRef.collection('sales').where('salesmanId', '==', S.profile.uid)
    .onSnapshot(s => {
      S.sales = s.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => {
          const da = a.saleDate?.toDate ? a.saleDate.toDate() : new Date(a.saleDate || 0);
          const db = b.saleDate?.toDate ? b.saleDate.toDate() : new Date(b.saleDate || 0);
          return db - da;
        });
      renderCurrent();
    }));
}

const PAGE_TITLES = { pos: 'বিক্রয় (POS)', 'my-sales': 'আমার বিক্রয়', products: 'প্রোডাক্ট', customers: 'কাস্টমার', settings: 'সেটিংস' };

function goTo(page) {
  S.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.remove('hide');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  closeDrawer();
  updateBottomNav();
  renderCurrent();
  window.scrollTo({ top: 0 });
}

function renderCurrent() {
  if (!S.profile) return;
  switch (S.currentPage) {
    case 'pos': renderPOS(); break;
    case 'my-sales': renderMySales(); break;
    case 'products': renderProducts(); break;
    case 'customers': renderCustomers(); break;
    case 'settings': renderSettings(); break;
  }
  updateCartBar();
}

function updateBottomNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'POS' },
    { p: 'my-sales', i: '🧾', l: 'আমার বিক্রয়' },
    { p: 'products', i: '📦', l: 'প্রোডাক্ট' },
    { p: '__menu', i: '☰', l: 'মেনু' },
  ];
  document.getElementById('bottomNav').innerHTML = items.map(it => `
    <button data-nav="${it.p}" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition
      ${S.currentPage === it.p ? 'text-green-600' : 'text-gray-500'}">
      <span class="text-[22px] leading-none">${it.i}</span>
      <span>${it.l}</span>
    </button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.nav === '__menu') openDrawer();
    else goTo(b.dataset.nav);
  }));
}

function openDrawer() {
  document.getElementById('drawer').classList.remove('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.remove('hide');
  buildDrawerNav();
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.add('hide');
}
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('menuBtn').addEventListener('click', openDrawer);

function buildDrawerNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'বিক্রয় (POS)' },
    { p: 'my-sales', i: '🧾', l: 'আমার বিক্রয়' },
    { p: 'products', i: '📦', l: 'প্রোডাক্ট' },
    { p: 'customers', i: '🧑‍🤝‍🧑', l: 'কাস্টমার' },
    { p: 'settings', i: '⚙️', l: 'সেটিংস' },
  ];
  document.getElementById('drawerNav').innerHTML = items.map(it => `
    <button data-dnav="${it.p}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium
      ${S.currentPage === it.p ? 'bg-green-50 text-green-600' : 'text-gray-700 hover:bg-gray-50'}">
      <span class="text-xl">${it.i}</span><span>${it.l}</span>
    </button>`).join('') + `
    <div class="border-t my-2"></div>
    <button id="drawerLogout" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium text-red-600 hover:bg-red-50">
      <span class="text-xl">🚪</span><span>লগআউট</span>
    </button>`;
  document.querySelectorAll('[data-dnav]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.dnav)));
  document.getElementById('drawerLogout').addEventListener('click', async () => {
    closeDrawer();
    if (await TP.askConfirm('লগআউট করতে চান?')) await TP.auth.signOut();
  });
}

/* ============================================================
   POS (same as admin)
   ============================================================ */
function renderPOS() {
  const el = document.getElementById('page-pos');
  const cats = [...new Set(S.products.map(p => p.category).filter(Boolean))];
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="flex gap-2">
        <button id="typeRetail" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏪 রিটেল</button>
        <button id="typeWhole" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏭 হোলসেল</button>
      </div>
      <input id="posSearch" type="search" placeholder="🔍 নাম / বারকোড..." value="${TP.esc(S.posSearch)}"
        class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white focus:border-green-500 focus:outline-none">
      ${cats.length ? `
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
        <button data-cat="" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">সব</button>
        ${cats.map(c => `<button data-cat="${TP.esc(c)}" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">${TP.esc(c)}</button>`).join('')}
      </div>` : ''}
      <div id="productGrid" class="grid grid-cols-2 gap-3 pb-2"></div>
    </div>`;
  document.getElementById('posSearch').addEventListener('input', e => { S.posSearch = e.target.value; renderProductGrid(); });
  document.getElementById('typeRetail').addEventListener('click', () => { S.saleType = 'retail'; updateTypeButtons(); renderProductGrid(); });
  document.getElementById('typeWhole').addEventListener('click', () => { S.saleType = 'wholesale'; updateTypeButtons(); renderProductGrid(); });
  document.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => { S.posCategory = b.dataset.cat; renderProductGrid(); }));
  updateTypeButtons();
  renderProductGrid();
}

function updateTypeButtons() {
  const r = document.getElementById('typeRetail');
  const w = document.getElementById('typeWhole');
  const on = 'bg-green-600 text-white shadow-lg';
  const off = 'bg-white text-gray-600 border-2 border-gray-200';
  r.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${S.saleType==='retail'?on:off}`;
  w.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${S.saleType==='wholesale'?on:off}`;
}

function renderProductGrid() {
  const g = document.getElementById('productGrid');
  if (!g) return;
  const q = S.posSearch.trim().toLowerCase();
  const list = S.products.filter(p => {
    if (S.posCategory && p.category !== S.posCategory) return false;
    if (!q) return true;
    return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q);
  });
  document.querySelectorAll('.cat-chip').forEach(b => {
    const on = b.dataset.cat === S.posCategory;
    b.className = `cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${on ? 'bg-green-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`;
  });
  if (!list.length) {
    g.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-16"><div class="text-5xl mb-3">📦</div><div>প্রোডাক্ট নেই</div></div>`;
    return;
  }
  g.innerHTML = list.map(p => {
    const price = S.saleType === 'retail' ? (+p.retailPrice || 0) : (+p.wholesalePrice || 0);
    const stock = +p.stockQty || 0;
    const out = stock <= 0;
    const low = !out && stock <= (+p.lowStockAlert || 0);
    return `<button data-add="${p.id}" class="text-left bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 active:scale-95 transition ${out ? 'opacity-50' : ''}">
      <div class="font-semibold text-gray-800 text-sm leading-snug line-clamp-2 min-h-[2.6rem]">${TP.esc(p.name)}</div>
      <div class="text-[11px] mt-1.5 font-medium ${out?'text-red-600':low?'text-orange-500':'text-gray-500'}">
        স্টক: ${TP.bn(stock)} ${TP.esc(p.unit||'')}${out?' • শেষ':low?' • কম':''}
      </div>
      <div class="text-green-600 font-extrabold mt-1.5 text-[17px]">${TP.money(price)}</div>
    </button>`;
  }).join('');
  g.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.add)));
}

function addToCart(pid) {
  const p = S.products.find(x => x.id === pid);
  if (!p) return;
  const price = S.saleType === 'retail' ? (+p.retailPrice || 0) : (+p.wholesalePrice || 0);
  const exist = S.cart.find(it => it.productId === pid);
  const inCart = exist ? exist.qty : 0;
  if (inCart + 1 > (+p.stockQty || 0)) { TP.toast('স্টক শেষ!', 'error'); return; }
  if (exist) exist.qty++;
  else S.cart.push({ productId: pid, name: p.name, unit: p.unit||'', price, qty: 1 });
  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  if (!bar) return;
  const count = S.cart.reduce((a, it) => a + it.qty, 0);
  const total = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  if (count === 0 || S.currentPage !== 'pos') { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  document.getElementById('cartCount').textContent = TP.bn(count);
  document.getElementById('cartTotal').textContent = TP.money(total);
}

document.getElementById('openCartBtn').addEventListener('click', openCart);

function openCart() {
  if (!S.cart.length) { TP.toast('কার্ট খালি', 'warn'); return; }
  S.discount = 0; S.paid = null; S.custMode = 'walkin'; S.custId = '';
  renderCartItems(); renderCartCheckout(); openModal('cartModal');
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  if (!el) return;
  if (!S.cart.length) { el.innerHTML = `<div class="text-center text-gray-400 py-10">কার্ট খালি</div>`; return; }
  el.innerHTML = S.cart.map((it, i) => `
    <div class="flex items-center gap-2 bg-gray-50 rounded-xl p-3">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm truncate">${TP.esc(it.name)}</div>
        <div class="text-xs text-gray-500 mt-0.5">${TP.money(it.price)} × ${TP.bn(it.qty)} ${TP.esc(it.unit)} = <b>${TP.money(it.price*it.qty)}</b></div>
      </div>
      <div class="flex items-center gap-1">
        <button data-dec="${i}" class="w-9 h-9 rounded-lg bg-white border border-gray-200 font-bold text-lg active:scale-90">−</button>
        <span class="w-7 text-center font-bold text-sm">${TP.bn(it.qty)}</span>
        <button data-inc="${i}" class="w-9 h-9 rounded-lg bg-white border border-gray-200 font-bold text-lg active:scale-90">+</button>
        <button data-rm="${i}" class="w-9 h-9 rounded-lg bg-red-50 text-red-600 font-bold active:scale-90">✕</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.inc, it = S.cart[i];
    const p = S.products.find(x => x.id === it.productId);
    if (it.qty + 1 > (+p?.stockQty || 0)) { TP.toast('স্টক শেষ!', 'error'); return; }
    it.qty++; renderCartItems(); updateSummary();
  }));
  el.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.dec, it = S.cart[i];
    if (it.qty > 1) it.qty--; else S.cart.splice(i, 1);
    renderCartItems(); updateSummary();
    if (!S.cart.length) closeModal('cartModal');
  }));
  el.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    S.cart.splice(+b.dataset.rm, 1);
    renderCartItems(); updateSummary();
    if (!S.cart.length) closeModal('cartModal');
  }));
}

function renderCartCheckout() {
  const el = document.getElementById('cartCheckout');
  if (!el) return;
  const subtotal = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  el.innerHTML = `
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-gray-600 mb-2 block">কাস্টমার</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-cm="walkin" class="cm-btn py-2.5 rounded-xl text-xs font-semibold transition">🚶 ওয়াক-ইন</button>
          <button data-cm="existing" class="cm-btn py-2.5 rounded-xl text-xs font-semibold transition">👤 পুরনো</button>
          <button data-cm="new" class="cm-btn py-2.5 rounded-xl text-xs font-semibold transition">🆕 নতুন</button>
        </div>
        <div id="cmExtra" class="mt-2"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-gray-600">ডিসকাউন্ট (৳)</label>
          <input id="discountInput" type="number" min="0" step="1" value="0" class="no-spin w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mt-1 focus:border-green-500 focus:outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">পরিশোধ (৳)</label>
          <input id="paidInput" type="number" min="0" step="1" value="${subtotal}" class="no-spin w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mt-1 focus:border-green-500 focus:outline-none">
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">

function updateSummary() {
  const subtotal = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paid = (document.getElementById('paidInput')||{}).value;
  paid = paid === '' ? total : +paid;
  const due = Math.max(0, total - paid);
  const change = Math.max(0, paid - total);
  document.getElementById('sumSub').textContent = TP.money(subtotal);
  document.getElementById('sumDisc').textContent = '- ' + TP.money(discount);
  document.getElementById('sumTotal').textContent = TP.money(total);
  document.getElementById('sumPaid').textContent = TP.money(paid);
  document.getElementById('sumDue').textContent = TP.money(due);
  document.getElementById('sumChange').textContent = TP.money(change);
}

async function completeSale() {
  if (!S.cart.length) { TP.toast('কার্ট খালি', 'error'); return; }
  const subtotal = S.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paidVal = (document.getElementById('paidInput')||{}).value;
  const paid = paidVal === '' ? total : (+paidVal || 0);
  const due = Math.max(0, total - paid);
  const method = (document.getElementById('payMethod')||{}).value || 'cash';

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true; btn.textContent = 'প্রসেস হচ্ছে...';

  try {
    const shopRef = TP.db.collection('shops').doc(S.shopId);
    let customerId = null, customerName = 'ওয়াক-ইন কাস্টমার', customerPhone = '';
    let newCustomerRef = null;

    if (S.custMode === 'existing') {
      const cid = (document.getElementById('custSelect')||{}).value || S.custId;
      if (!cid) throw new Error('কাস্টমার নির্বাচন করুন');
      const c = S.customers.find(x => x.id === cid);
      if (c) { customerId = c.id; customerName = c.name; customerPhone = c.phone || ''; }
    } else if (S.custMode === 'new') {
      const name = ((document.getElementById('newCustName')||{}).value || '').trim();
      const phone = ((document.getElementById('newCustPhone')||{}).value || '').trim();
      if (!name) throw new Error('কাস্টমারের নাম দিন');
      newCustomerRef = shopRef.collection('customers').doc();
      customerId = newCustomerRef.id;
      customerName = name;
      customerPhone = phone;
    }

    const tk = TP.todayKey();
    const todayInvoices = S.sales.filter(s => (s.invoiceNo||'').includes('-' + tk + '-'));
    const maxSeq = todayInvoices.reduce((m, s) => Math.max(m, parseInt((s.invoiceNo||'').split('-').pop(), 10) || 0), 0);
    const invoiceNo = `INV-${tk}-${String(maxSeq + 1).padStart(4, '0')}`;

    const batch = TP.db.batch();
    const saleRef = shopRef.collection('sales').doc();

    for (const it of S.cart) {
      const p = S.products.find(x => x.id === it.productId);
      if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty||0) - it.qty });
    }

    if (newCustomerRef) {
      batch.set(newCustomerRef, { name: customerName, phone: customerPhone, address: '', due: due, createdAt: TP.FV.serverTimestamp() });
    } else if (customerId && due > 0) {
      const c = S.customers.find(x => x.id === customerId);
      if (c) batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) + due });
    }

    batch.set(saleRef, {
      invoiceNo, customerId, customerName, customerPhone,
      salesmanId: S.profile.uid, salesmanName: S.profile.name,
      type: S.saleType, items: S.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method, saleDate: TP.FV.serverTimestamp(),
    });

    await batch.commit();

    const sale = {
      id: saleRef.id, invoiceNo, customerId, customerName, customerPhone,
      salesmanId: S.profile.uid, salesmanName: S.profile.name,
      type: S.saleType, items: S.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method, saleDate: new Date(),
    };

    S.cart = [];
    closeModal('cartModal');
    setTimeout(() => showInvoice(sale), 200);
    TP.toast('বিক্রয় সম্পন্ন!', 'success');
  } catch (err) {
    console.error(err);
    TP.toast(err.message || 'বিক্রয় ব্যর্থ', 'error');
    btn.disabled = false; btn.textContent = '✓ বিক্রয় সম্পন্ন';
  }
}

        <div class="flex flex-wrap gap-x-3 text-xs text-gray-500 mt-1.5">
          <span>🏪 <b>${TP.money(p.retailPrice)}</b></span>
          <span>🏭 <b>${TP.money(p.wholesalePrice)}</b></span>
        </div>
        <div class="mt-1.5">
          <span class="inline-block px-2 py-0.5 rounded-md text-[11px] font-semibold ${stock<=0?'bg-red-100 text-red-600':low?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700'}">
            স্টক: ${TP.bn(stock)} ${TP.esc(p.unit||'')}
          </span>
        </div>
      </div>`;
    }).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">কোনো প্রোডাক্ট নেই</div>`;
  };
  renderList();
  document.getElementById('prodSearch').addEventListener('input', e => renderList(e.target.value));
}

/* ============================================================
   CUSTOMERS (view only)
   ============================================================ */
function renderCustomers() {
  const el = document.getElementById('page-customers');
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <input id="custSearch" type="search" placeholder="🔍 কাস্টমার খুঁজুন..."
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-green-500 focus:outline-none">
      <div id="custList" class="space-y-2"></div>
    </div>`;
  const renderList = (q = '') => {
    const list = S.customers.filter(c => !q || (c.name||'').toLowerCase().includes(q.toLowerCase()) || (c.phone||'').includes(q));
    document.getElementById('custList').innerHTML = list.length ? list.map(c => `
      <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100 flex justify-between items-start gap-2">
        <div class="min-w-0 flex-1">
          <div class="font-semibold text-sm truncate">${TP.esc(c.name)}</div>
          ${c.phone ? `<div class="text-xs text-gray-500">📞 ${TP.bn(c.phone)}</div>` : ''}
        </div>
        ${(+c.due||0)>0 ? `<div class="font-bold text-red-600 text-sm">বাকি ${TP.money(c.due)}</div>` : `<div class="text-xs text-green-600 font-medium">পরিশোধিত</div>`}
      </div>`).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">কোনো কাস্টমার নেই</div>`;
  };
  renderList();
  document.getElementById('custSearch').addEventListener('input', e => renderList(e.target.value));
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings() {
  const el = document.getElementById('page-settings');
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold mb-2">🏪 শপ তথ্য</h3>
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs text-gray-500">Shop ID:</span>
          <span class="font-mono font-bold text-green-600 bg-green-50 px-2 py-1 rounded text-sm">${TP.esc(S.shopId)}</span>
        </div>
        <div class="text-sm text-gray-700">
          <div><b>${TP.esc(S.profile.shop.shopName)}</b></div>
          ${S.profile.shop.settings?.shopAddress ? `<div class="text-xs text-gray-500 mt-1">${TP.esc(S.profile.shop.settings.shopAddress)}</div>` : ''}
          ${S.profile.shop.phone ? `<div class="text-xs text-gray-500 mt-0.5">📞 ${TP.bn(S.profile.shop.phone)}</div>` : ''}
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold mb-2">👤 অ্যাকাউন্ট</h3>
        <div class="text-sm space-y-1">
          <div class="flex justify-between"><span class="text-gray-500">নাম</span><b>${TP.esc(S.profile.name)}</b></div>
          <div class="flex justify-between"><span class="text-gray-500">ইউজারনেম</span><b class="font-mono">${TP.esc(S.profile.username)}</b></div>
          <div class="flex justify-between"><span class="text-gray-500">রোল</span><b>সেলসম্যান</b></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold mb-3">🔐 পাসওয়ার্ড পরিবর্তন</h3>
        <input id="oldPass" type="password" placeholder="পুরনো পাসওয়ার্ড" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mb-2 focus:border-green-500 focus:outline-none">
        <input id="newPass" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬)" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mb-2 focus:border-green-500 focus:outline-none">
        <input id="newPass2" type="password" placeholder="আবার লিখুন" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl mb-3 focus:border-green-500 focus:outline-none">
        <button id="changePass" class="w-full bg-gray-800 text-white py-3 rounded-xl font-semibold">পরিবর্তন করুন</button>
      </div>
    </div>`;
  document.getElementById('changePass').addEventListener('click', async () => {
    const oldP = document.getElementById('oldPass').value;
    const np = document.getElementById('newPass').value;
    const np2 = document.getElementById('newPass2').value;
    if (np !== np2) { TP.toast('পাসওয়ার্ড মিলছে না', 'error'); return; }
    if (np.length < 6) { TP.toast('কমপক্ষে ৬ অক্ষর', 'error'); return; }
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(TP.auth.currentUser.email, oldP);
      await TP.auth.currentUser.reauthenticateWithCredential(cred);
      await TP.auth.currentUser.updatePassword(np);
      TP.toast('সফল!', 'success');
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newPass2').value = '';
    } catch (err) {
      let msg = 'পরিবর্তন ব্যর্থ';
      if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'পুরনো পাসওয়ার্ড ভুল';
      if (err.code === 'auth/weak-password') msg = 'পাসওয়ার্ড দুর্বল';
      TP.toast(msg, 'error');
    }
  });
}

window.goTo = goTo;
</script>
</body>
</html>
