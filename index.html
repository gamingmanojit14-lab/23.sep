<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TextilePOS — কাপড়ের ব্যবসার ম্যানেজমেন্ট</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans Bengali',system-ui,sans-serif}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .fade{animation:fadeUp .4s ease}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 flex items-center justify-center p-4">

<div class="w-full max-w-md fade">
  <div class="bg-white rounded-3xl shadow-2xl p-8 text-center">
    <div class="text-7xl mb-3">🧵</div>
    <h1 class="text-3xl font-extrabold text-gray-800 mb-1">TextilePOS</h1>
    <p class="text-gray-500 text-sm mb-8">কাপড়ের ব্যবসার সম্পূর্ণ ম্যানেজমেন্ট</p>

    <div class="space-y-3">
      <a href="login.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/30 transition active:scale-[.98]">
        🔐 লগইন করুন
      </a>
      <a href="register.html" class="block w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-green-500/30 transition active:scale-[.98]">
        🆕 নতুন দোকান খুলুন
      </a>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-100">
      <div class="flex justify-around text-xs text-gray-500">
        <div><div class="text-xl mb-1">☁️</div>ক্লাউড সিঙ্ক</div>
        <div><div class="text-xl mb-1">📱</div>মোবাইল ফ্রেন্ডলি</div>
        <div><div class="text-xl mb-1">🔒</div>নিরাপদ</div>
      </div>
    </div>
  </div>
  <p class="text-center text-white/70 text-xs mt-4">Firebase-powered • রিয়েল-টাইম সিঙ্ক</p>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  // Auto-redirect if already logged in
  if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey !== 'AIzaSyDc8Ui4b7oXfjpngns6Vd7TFyCfkt1TJeQ') {
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      firebase.auth().onAuthStateChanged(async user => {
        if (!user) return;
        try {
          const doc = await firebase.firestore().collection('users').doc(user.uid).get();
          if (doc.exists) {
            location.href = doc.data().role === 'admin' ? 'admin.html' : 'salesman.html';
          }
        } catch {}
      });
    } catch (e) { console.error(e); }
  }
</script>
</body>
</html>
