<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>অ্যাডমিন প্যানেল — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary:'#2563eb', success:'#16a34a', danger:'#dc2626', warn:'#f59e0b' }
}}}
</script>
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Noto Sans Bengali',system-ui,sans-serif; }
  input,select,textarea,button{ font-family:inherit; }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .slide-up{animation:slideUp .25s cubic-bezier(.2,.9,.3,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .2s ease}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hide{display:none !important}
  @keyframes scanPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
  .scan-pulse{animation:scanPulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.5s infinite}
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="loadingScreen" class="fixed inset-0 bg-blue-600 flex items-center justify-center z-[999]">
  <div class="text-white text-center">
    <div class="text-6xl mb-3">🧵</div>
    <div class="text-lg font-bold">লোড হচ্ছে...</div>
  </div>
</div>

<div id="app" class="hide min-h-screen">
  <header class="fixed top-0 inset-x-0 h-14 bg-blue-600 text-white flex items-center px-2 z-40 shadow-md">
    <button id="menuBtn" class="p-2 w-11 h-11 flex items-center justify-center rounded-lg active:bg-white/20">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="pageTitle" class="flex-1 text-lg font-bold ml-1 truncate">POS</h1>
    <div class="text-right leading-tight pr-2">
      <div id="userName" class="text-sm font-semibold truncate max-w-[120px]"></div>
      <div id="userRole" class="text-[10px] opacity-80"></div>
    </div>
  </header>

  <div id="drawerBackdrop" class="hide fixed inset-0 bg-black/60 z-50"></div>
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-72 max-w-[85vw] bg-white z-[60] -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
    <div class="bg-blue-600 text-white p-5">
      <div class="text-3xl mb-2">🧵</div>
      <div id="drawerShop" class="font-bold text-base truncate"></div>
      <div class="mt-1.5 inline-flex items-center gap-1 text-[11px] bg-white/20 px-2 py-1 rounded-md">
        <span>Shop:</span><span id="drawerShopId" class="font-mono font-bold"></span>
      </div>
      <div id="drawerUser" class="text-[11px] opacity-80 mt-1.5"></div>
    </div>
    <nav id="drawerNav" class="p-2"></nav>
  </aside>

  <main class="pt-14 pb-24 min-h-screen">
    <section id="page-pos" class="page"></section>
    <section id="page-dashboard" class="page hide"></section>
    <section id="page-sales" class="page hide"></section>
    <section id="page-products" class="page hide"></section>
    <section id="page-inventory" class="page hide"></section>
    <section id="page-customers" class="page hide"></section>
    <section id="page-salesmen" class="page hide"></section>
    <section id="page-reports" class="page hide"></section>
    <section id="page-settings" class="page hide"></section>
  </main>

  <div id="cartBar" class="hide fixed bottom-[68px] inset-x-0 z-30 px-3 pointer-events-none">
    <button id="openCartBtn" class="w-full pointer-events-auto bg-green-600 text-white rounded-2xl py-3.5 px-5 flex items-center justify-between shadow-2xl active:scale-[.98] transition">
      <span class="text-sm font-semibold">🛒 কার্ট: <span id="cartCount">০</span></span>
      <span class="font-extrabold text-lg" id="cartTotal">৳০</span>
      <span class="text-sm font-semibold bg-white/20 px-3 py-1 rounded-lg">চেকআউট →</span>
    </button>
  </div>

  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 h-[68px] bg-white border-t border-gray-200 flex z-30 shadow-[0_-2px_10px_rgba(0,0,0,.05)]"></nav>
</div>

<div id="cartModal" class="hide fixed inset-0 z-[80] bg-black/60 items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[94vh] flex flex-col slide-up">
    <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
      <h2 class="font-bold text-lg">🛒 কার্ট</h2>
      <button data-close="cartModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="cartItems"></div>
    <div class="p-4 border-t bg-gray-50 flex-shrink-0 max-h-[60vh] overflow-y-auto" id="cartCheckout"></div>
  </div>
</div>

<div id="invoiceModal" class="hide fixed inset-0 z-[85] bg-black/70 items-center justify-center p-2">
  <div class="bg-white w-full max-w-2xl rounded-2xl max-h-[96vh] flex flex-col fade-in">
    <div class="p-3 border-b flex items-center justify-between">
      <h2 class="font-bold">🧾 ইনভয়েস</h2>
      <button data-close="invoiceModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="invoiceBody"></div>
    <div class="p-3 border-t flex gap-2">
      <button id="printThermal" class="flex-1 bg-gray-700 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 থার্মাল</button>
      <button id="printA4" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">🖨 A4</button>
      <button data-close="invoiceModal" class="flex-1 bg-gray-200 py-3 rounded-xl font-semibold text-sm active:scale-95">বন্ধ</button>
    </div>
  </div>
</div>

<div id="formModal" class="hide fixed inset-0 z-[88] bg-black/60 items-center justify-center p-3">
  <div class="bg-white rounded-2xl w-full max-w-md max-h-[92vh] flex flex-col fade-in">
    <div class="p-4 border-b flex items-center justify-between">
      <h2 id="formModalTitle" class="font-bold text-lg"></h2>
      <button data-close="formModal" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-2xl leading-none">×</button>
    </div>
    <form id="formModalForm" class="flex flex-col flex-1 overflow-hidden">
      <div id="formModalBody" class="p-4 space-y-3 overflow-y-auto flex-1"></div>
      <div id="formModalFooter" class="p-4 border-t flex gap-2">
        <button type="button" data-close="formModal" class="flex-1 bg-gray-100 py-3 rounded-xl font-semibold">বাতিল</button>
        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold">সেভ করুন</button>
      </div>
    </form>
  </div>
</div>

<iframe id="printFrame" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="common.js"></script>

<script>
/* ============================================================
   ADMIN PANEL
   ============================================================ */
const A = {
  profile: null, shopId: null,
  products: [], customers: [], sales: [], payments: [], users: [],
  cart: [], saleType: 'retail', posSearch: '', posCategory: '',
  custMode: 'walkin', custId: '',
  discount: 0, paid: null, payMethod: 'cash',
  currentInvoice: null, currentPage: 'pos',
  unsubs: [],
  salesFilter: { salesmanId: '', q: '' },
  reportPeriod: 'today',
  // Remote scanner
  scannerSessionId: null,
  scannerUnsub: null,
  // Remote payment
  paymentSessionId: null,
};

function openModal(id) { const m = document.getElementById(id); if (m) { m.classList.remove('hide'); m.classList.add('flex'); } }
function closeModal(id) { const m = document.getElementById(id); if (m) { m.classList.add('hide'); m.classList.remove('flex'); } }
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-close]');
  if (btn) closeModal(btn.dataset.close);
});

function openForm(title, fields, values, onSubmit) {
  values = values || {};
  document.getElementById('formModalTitle').textContent = title;
  document.getElementById('formModalBody').innerHTML = fields.map(f => {
    const v = values[f.name] !== undefined ? values[f.name] : (f.default || '');
    const cls = 'w-full px-3.5 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none text-base';
    if (f.type === 'select') {
      return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
        <select name="${f.name}" class="${cls}" ${f.required?'required':''}>
          ${f.options.map(o => `<option value="${TP.esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${TP.esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
        <textarea name="${f.name}" rows="3" class="${cls}" ${f.required?'required':''}>${TP.esc(v)}</textarea></div>`;
    }
    return `<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">${TP.esc(f.label)}</label>
      <input name="${f.name}" type="${f.type||'text'}" value="${TP.esc(v)}" class="${cls} no-spin"
        ${f.required?'required':''} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.placeholder?`placeholder="${TP.esc(f.placeholder)}"`:''}></div>`;
  }).join('');

  document.getElementById('formModalFooter').style.display = 'flex';
  const form = document.getElementById('formModalForm');
  form.onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try { await onSubmit(data); closeModal('formModal'); }
    catch (err) { console.error(err); TP.toast(err.message || 'সেভ করা যায়নি', 'error'); }
  };
  openModal('formModal');
  setTimeout(() => document.querySelector('#formModalBody input, #formModalBody select')?.focus(), 100);
}

/* ── BOOT ── */
(async function boot() {
  const profile = await TP.requireAuth('admin');
  A.profile = profile;
  A.shopId = profile.shopId;
  await restoreScannerSession();
  restorePaymentSession();
  document.getElementById('loadingScreen').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderShell();
  setupListeners();
  goTo('pos');
})();

function renderShell() {
  document.getElementById('userName').textContent = A.profile.name;
  document.getElementById('userRole').textContent = 'অ্যাডমিন';
  document.getElementById('drawerShop').textContent = A.profile.shop.shopName;
  document.getElementById('drawerShopId').textContent = A.shopId;
  document.getElementById('drawerUser').textContent = A.profile.name + ' • অ্যাডমিন';
  updateBottomNav();
}

function setupListeners() {
  const sid = A.shopId;
  const shopRef = TP.db.collection('shops').doc(sid);
  A.unsubs.push(shopRef.collection('products').onSnapshot(s => {
    A.products = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('customers').onSnapshot(s => {
    A.customers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('sales').orderBy('saleDate', 'desc').limit(500).onSnapshot(s => {
    A.sales = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCurrent();
  }));
  A.unsubs.push(shopRef.collection('payments').orderBy('paymentDate', 'desc').limit(500).onSnapshot(s => {
    A.payments = s.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  A.unsubs.push(TP.db.collection('users').where('shopId', '==', sid).onSnapshot(s => {
    A.users = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (A.currentPage === 'salesmen') renderSalesmen();
  }));
  A.unsubs.push(shopRef.onSnapshot(s => {
    if (s.exists) {
      A.profile.shop = { shopId: sid, ...s.data() };
      renderShell();
      if (A.currentPage === 'settings') renderSettings();
    }
  }));
}

const PAGE_TITLES = {
  pos: 'বিক্রয় (POS)', dashboard: 'ড্যাশবোর্ড', sales: 'সব বিক্রয়',
  products: 'প্রোডাক্ট', inventory: 'স্টক ম্যানেজমেন্ট', customers: 'কাস্টমার',
  salesmen: 'সেলসম্যান', reports: 'রিপোর্ট', settings: 'সেটিংস',
};

function goTo(page) {
  A.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.add('hide'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.remove('hide');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  closeDrawer();
  updateBottomNav();
  renderCurrent();
  window.scrollTo({ top: 0 });
}

function renderCurrent() {
  if (!A.profile) return;
  switch (A.currentPage) {
    case 'pos': renderPOS(); break;
    case 'dashboard': renderDashboard(); break;
    case 'sales': renderSales(); break;
    case 'products': renderProducts(); break;
    case 'inventory': renderInventory(); break;
    case 'customers': renderCustomers(); break;
    case 'salesmen': renderSalesmen(); break;
    case 'reports': renderReports(); break;
    case 'settings': renderSettings(); break;
  }
  updateCartBar();
}

function updateBottomNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'POS' },
    { p: 'dashboard', i: '📊', l: 'ড্যাশ' },
    { p: 'sales', i: '🧾', l: 'বিক্রয়' },
    { p: '__menu', i: '☰', l: 'মেনু' },
  ];
  document.getElementById('bottomNav').innerHTML = items.map(it => `
    <button data-nav="${it.p}" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition
      ${A.currentPage === it.p ? 'text-blue-600' : 'text-gray-500'}">
      <span class="text-[22px] leading-none">${it.i}</span>
      <span>${it.l}</span>
    </button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.nav === '__menu') openDrawer();
    else goTo(b.dataset.nav);
  }));
}

function openDrawer() {
  document.getElementById('drawer').classList.remove('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.remove('hide');
  buildDrawerNav();
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('-translate-x-full');
  document.getElementById('drawerBackdrop').classList.add('hide');
}
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('menuBtn').addEventListener('click', openDrawer);

function buildDrawerNav() {
  const items = [
    { p: 'pos', i: '🛒', l: 'বিক্রয় (POS)' },
    { p: 'dashboard', i: '📊', l: 'ড্যাশবোর্ড' },
    { p: 'sales', i: '🧾', l: 'সব বিক্রয়' },
    { p: 'products', i: '📦', l: 'প্রোডাক্ট' },
    { p: 'inventory', i: '🏪', l: 'স্টক ম্যানেজমেন্ট' },
    { p: 'customers', i: '🧑‍🤝‍🧑', l: 'কাস্টমার' },
    { p: 'salesmen', i: '👥', l: 'সেলসম্যান' },
    { p: 'reports', i: '📈', l: 'রিপোর্ট' },
    { p: 'settings', i: '⚙️', l: 'সেটিংস' },
  ];
  document.getElementById('drawerNav').innerHTML = items.map(it => `
    <button data-dnav="${it.p}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium
      ${A.currentPage === it.p ? 'bg-blue-50 text-blue-600' : 'text-gray-700 hover:bg-gray-50'}">
      <span class="text-xl">${it.i}</span><span>${it.l}</span>
    </button>`).join('') + `
    <div class="border-t my-2"></div>
    <button id="drawerLogout" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium text-red-600 hover:bg-red-50">
      <span class="text-xl">🚪</span><span>লগআউট</span>
    </button>`;
  document.querySelectorAll('[data-dnav]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.dnav)));
  document.getElementById('drawerLogout').addEventListener('click', async () => {
    closeDrawer();
    if (!await TP.askConfirm('লগআউট করতে চান?')) return;
    if (A.scannerSessionId) { try { await TP.deleteScannerSession(A.scannerSessionId); } catch {} A.scannerSessionId = null; localStorage.removeItem('tp_scanner_session'); }
    if (A.paymentSessionId) { try { await TP.deletePaymentSession(A.paymentSessionId); } catch {} A.paymentSessionId = null; localStorage.removeItem('tp_payment_session'); }
    await TP.auth.signOut();
  });
}

/* ============================================================
   POS
   ============================================================ */
function renderPOS() {
  const el = document.getElementById('page-pos');
  const cats = [...new Set(A.products.map(p => p.category).filter(Boolean))];
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="flex gap-2">
        <button id="typeRetail" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏪 রিটেল</button>
        <button id="typeWhole" class="flex-1 py-3 rounded-xl font-semibold text-sm transition">🏭 হোলসেল</button>
      </div>

      <div class="flex gap-2">
        <div class="relative flex-1 scan-pulse rounded-xl">
          <input id="barcodeInput" type="text" inputmode="numeric" autocomplete="off"
            placeholder="📷 বারকোড স্ক্যান..."
            class="w-full px-4 py-4 rounded-xl border-2 border-dashed border-blue-500 bg-blue-50 focus:border-blue-700 focus:bg-white focus:outline-none text-base font-mono pr-12">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-bold pointer-events-none">SCAN</div>
        </div>
        <button id="qrScanBtn" class="px-4 rounded-xl bg-blue-600 text-white font-bold text-2xl active:scale-95 transition" title="QR স্ক্যান">📱</button>
      </div>

      <input id="posSearch" type="search" placeholder="🔍 নাম দিয়ে খুঁজুন..." value="${TP.esc(A.posSearch)}"
        class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white focus:border-blue-500 focus:outline-none">

      ${cats.length ? `
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
        <button data-cat="" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">সব</button>
        ${cats.map(c => `<button data-cat="${TP.esc(c)}" class="cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">${TP.esc(c)}</button>`).join('')}
      </div>` : ''}

      <div id="productGrid" class="grid grid-cols-2 gap-3 pb-2"></div>
    </div>`;

  const bcInput = document.getElementById('barcodeInput');
  bcInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleBarcodeScan(e.target.value.trim()); e.target.value = ''; }
  });
  setTimeout(() => bcInput.focus(), 200);

  document.getElementById('qrScanBtn').addEventListener('click', () => {
    TP.openQRScanner(code => handleBarcodeScan(String(code).trim()));
  });

  document.getElementById('posSearch').addEventListener('input', e => { A.posSearch = e.target.value; renderProductGrid(); });
  document.getElementById('typeRetail').addEventListener('click', () => { A.saleType = 'retail'; updateTypeButtons(); renderProductGrid(); });
  document.getElementById('typeWhole').addEventListener('click', () => { A.saleType = 'wholesale'; updateTypeButtons(); renderProductGrid(); });
  document.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => { A.posCategory = b.dataset.cat; renderProductGrid(); }));
  updateTypeButtons();
  renderProductGrid();
}

function handleBarcodeScan(code) {
  if (!code) return;
  const product = A.products.find(p => String(p.barcode || '').trim() === code);
  if (!product) { TP.toast('বারকোড পাওয়া যায়নি: ' + code, 'error'); return; }
  if ((+product.stockQty || 0) <= 0) { TP.toast(product.name + ' — স্টক শেষ!', 'error'); return; }
  addToCart(product.id);
  TP.toast('✓ ' + product.name, 'success');
  const bc = document.getElementById('barcodeInput');
  if (bc) bc.focus();
}

function updateTypeButtons() {
  const r = document.getElementById('typeRetail'), w = document.getElementById('typeWhole');
  const on = 'bg-blue-600 text-white shadow-lg', off = 'bg-white text-gray-600 border-2 border-gray-200';
  r.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${A.saleType==='retail'?on:off}`;
  w.className = `flex-1 py-3 rounded-xl font-semibold text-sm transition ${A.saleType==='wholesale'?on:off}`;
}

function renderProductGrid() {
  const g = document.getElementById('productGrid');
  if (!g) return;
  const q = A.posSearch.trim().toLowerCase();
  const list = A.products.filter(p => {
    if (A.posCategory && p.category !== A.posCategory) return false;
    if (!q) return true;
    return (p.name||'').toLowerCase().includes(q) || (p.barcode||'').includes(q);
  });
  document.querySelectorAll('.cat-chip').forEach(b => {
    const on = b.dataset.cat === A.posCategory;
    b.className = `cat-chip flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap ${on ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`;
  });
  if (!list.length) {
    g.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-16"><div class="text-5xl mb-3">📦</div><div>প্রোডাক্ট নেই</div>
      <button onclick="goTo('products')" class="mt-3 text-blue-600 underline text-sm">প্রোডাক্ট যোগ করুন</button></div>`;
    return;
  }
  g.innerHTML = list.map(p => {
    const price = A.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
    const stock = +p.stockQty || 0;
    const out = stock <= 0, low = !out && stock <= (+p.lowStockAlert||0);
    return `<button data-add="${p.id}" class="text-left bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 active:scale-95 transition ${out?'opacity-50':''}">
      <div class="font-semibold text-gray-800 text-sm leading-snug line-clamp-2 min-h-[2.6rem]">${TP.esc(p.name)}</div>
      ${p.barcode ? `<div class="text-[9px] text-gray-400 font-mono truncate">#${TP.esc(p.barcode)}</div>` : ''}
      <div class="text-[11px] mt-1 font-medium ${out?'text-red-600':low?'text-orange-500':'text-gray-500'}">
        স্টক: ${TP.bn(stock)} ${TP.esc(p.unit||'')}
      </div>
      <div class="text-blue-600 font-extrabold mt-1.5 text-[17px]">${TP.money(price)}</div>
    </button>`;
  }).join('');
  g.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.add)));
}

function addToCart(pid) {
  const p = A.products.find(x => x.id === pid);
  if (!p) return;
  const price = A.saleType === 'retail' ? (+p.retailPrice||0) : (+p.wholesalePrice||0);
  const exist = A.cart.find(it => it.productId === pid);
  const inCart = exist ? exist.qty : 0;
  if (inCart + 1 > (+p.stockQty||0)) { TP.toast('স্টক শেষ!', 'error'); return; }
  if (exist) exist.qty++;
  else A.cart.push({ productId: pid, name: p.name, unit: p.unit||'', price, qty: 1 });
  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  if (!bar) return;
  const count = A.cart.reduce((a, it) => a + it.qty, 0);
  const total = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  if (count === 0 || A.currentPage !== 'pos') { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  document.getElementById('cartCount').textContent = TP.bn(count);
  document.getElementById('cartTotal').textContent = TP.money(total);
}

document.getElementById('openCartBtn').addEventListener('click', openCart);

function openCart() {
  if (!A.cart.length) { TP.toast('কার্ট খালি', 'warn'); return; }
  A.discount = 0; A.paid = null; A.custMode = 'walkin'; A.custId = '';
  renderCartItems(); renderCartCheckout(); openModal('cartModal');
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  if (!el) return;
  if (!A.cart.length) { el.innerHTML = `<div class="text-center text-gray-400 py-10">কার্ট খালি</div>`; return; }
  el.innerHTML = A.cart.map((it, i) => `
    <div class="flex items-center gap-2 bg-gray-50 rounded-xl p-3 fade-in">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm truncate">${TP.esc(it.name)}</div>
        <div class="text-xs text-gray-500 mt-0.5">${TP.money(it.price)} × ${TP.bn(it.qty)} ${TP.esc(it.unit)} = <b>${TP.money(it.price*it.qty)}</b></div>
      </div>
      <div class="flex items-center gap-1">
        <button data-dec="${i}" class="w-9 h-9 rounded-lg bg-white border border-gray-200 font-bold text-lg active:scale-90">−</button>
        <span class="w-7 text-center font-bold text-sm">${TP.bn(it.qty)}</span>
        <button data-inc="${i}" class="w-9 h-9 rounded-lg bg-white border border-gray-200 font-bold text-lg active:scale-90">+</button>
        <button data-rm="${i}" class="w-9 h-9 rounded-lg bg-red-50 text-red-600 font-bold active:scale-90">✕</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.inc, it = A.cart[i];
    const p = A.products.find(x => x.id === it.productId);
    if (it.qty + 1 > (+p?.stockQty || 0)) { TP.toast('স্টক শেষ!', 'error'); return; }
    it.qty++; renderCartItems(); updateSummary();
  }));
  el.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.dec, it = A.cart[i];
    if (it.qty > 1) it.qty--; else A.cart.splice(i, 1);
    renderCartItems(); updateSummary();
    if (!A.cart.length) closeModal('cartModal');
  }));
  el.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    A.cart.splice(+b.dataset.rm, 1);
    renderCartItems(); updateSummary();
    if (!A.cart.length) closeModal('cartModal');
  }));
}

function renderCmExtra() {

  if (!el) return;
  if (A.custMode === 'existing') {

function updateSummary() {
  const subtotal = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paid = (document.getElementById('paidInput')||{}).value;
  paid = paid === '' ? total : +paid;
  const due = Math.max(0, total - paid);
  const change = Math.max(0, paid - total);
  document.getElementById('sumSub').textContent = TP.money(subtotal);
  document.getElementById('sumDisc').textContent = '- ' + TP.money(discount);
  document.getElementById('sumTotal').textContent = TP.money(total);
  document.getElementById('sumPaid').textContent = TP.money(paid);
  document.getElementById('sumDue').textContent = TP.money(due);
  document.getElementById('sumChange').textContent = TP.money(change);
}

async function completeSale() {
  if (!A.cart.length) { TP.toast('কার্ট খালি', 'error'); return; }
  const subtotal = A.cart.reduce((a, it) => a + it.qty * it.price, 0);
  const discount = +((document.getElementById('discountInput')||{}).value || 0);
  const total = Math.max(0, subtotal - discount);
  let paidVal = (document.getElementById('paidInput')||{}).value;
  const paid = paidVal === '' ? total : (+paidVal || 0);
  const due = Math.max(0, total - paid);
  const method = (document.getElementById('payMethod')||{}).value || 'cash';
  const btn = document.getElementById('checkoutBtn');

  // 💳 UPI payment flow
  if (method === 'upi') {
    const st = A.profile.shop.settings || {};
    if (!st.upiId) {
      TP.toast('Settings এ UPI ID সেট করুন', 'error');
      return;
    }

    let paidConfirm = false;

    // Try remote payment device first
    if (A.paymentSessionId) {
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '📱 ডিভাইসে পাঠানো হচ্ছে...';
      try {
        const result = await TP.requestRemotePayment(A.paymentSessionId, {
          amount: paid || total,
          invoiceNo: 'প্রস্তাবিত',
        });
        if (result === 'paid') {
          paidConfirm = true;
          TP.toast('✓ রিমোট পেমেন্ট কনফার্ম', 'success');
        } else if (result === 'cancelled') {
          TP.toast('ডিভাইসে বাতিল হয়েছে', 'warn');
          btn.disabled = false; btn.textContent = oldText;
          return;
        } else {
          TP.toast('ডিভাইস সাড়া দেয়নি — ইন-অ্যাপ QR', 'warn');
        }
      } catch (e) {
        console.error(e);
        TP.toast('ডিভাইসে পাঠানো যায়নি', 'error');
      }
    }

    // Fallback: in-app QR modal
    if (!paidConfirm) {
      const payResult = await TP.showUPIPaymentModal({
        upiId: st.upiId,
        upiName: st.upiName,
        amount: paid || total,
        invoiceNo: 'প্রস্তাবিত',
        shopName: st.shopName || A.profile.shop.shopName,
      });
      if (payResult !== 'received') {
        TP.toast('পেমেন্ট বাতিল', 'warn');
        btn.disabled = false; btn.textContent = '✓ বিক্রয় সম্পন্ন';
        return;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'প্রসেস হচ্ছে...';

  try {
    const shopRef = TP.db.collection('shops').doc(A.shopId);
    let customerId = null, customerName = 'ওয়াক-ইন কাস্টমার', customerPhone = '';
    let newCustomerRef = null;
    if (A.custMode === 'existing') {
      const cid = (document.getElementById('custSelect')||{}).value || A.custId;
      if (!cid) throw new Error('কাস্টমার নির্বাচন করুন');
      const c = A.customers.find(x => x.id === cid);
      if (c) { customerId = c.id; customerName = c.name; customerPhone = c.phone || ''; }
    } else if (A.custMode === 'new') {
      const name = ((document.getElementById('newCustName')||{}).value || '').trim();
      const phone = ((document.getElementById('newCustPhone')||{}).value || '').trim();
      if (!name) throw new Error('নাম দিন');
      newCustomerRef = shopRef.collection('customers').doc();
      customerId = newCustomerRef.id; customerName = name; customerPhone = phone;
    }
    const tk = TP.todayKey();
    const todayInvoices = A.sales.filter(s => (s.invoiceNo||'').includes('-' + tk + '-'));
    const maxSeq = todayInvoices.reduce((m, s) => Math.max(m, parseInt((s.invoiceNo||'').split('-').pop(), 10) || 0), 0);
    const invoiceNo = `INV-${tk}-${String(maxSeq + 1).padStart(4, '0')}`;
    const batch = TP.db.batch();
    const saleRef = shopRef.collection('sales').doc();
    for (const it of A.cart) {
      const p = A.products.find(x => x.id === it.productId);
      if (p) batch.update(shopRef.collection('products').doc(p.id), { stockQty: (+p.stockQty||0) - it.qty });
    }
    if (newCustomerRef) batch.set(newCustomerRef, { name: customerName, phone: customerPhone, address: '', due: due, createdAt: TP.FV.serverTimestamp() });
    else if (customerId && due > 0) {
      const c = A.customers.find(x => x.id === customerId);
      if (c) batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) + due });
    }
    batch.set(saleRef, {
      invoiceNo, customerId, customerName, customerPhone,
      salesmanId: A.profile.uid, salesmanName: A.profile.name,
      type: A.saleType, items: A.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due,
      paymentMethod: method, saleDate: TP.FV.serverTimestamp(),
    });
    await batch.commit();
    const sale = {
      id: saleRef.id, invoiceNo, customerId, customerName, customerPhone,
      salesmanId: A.profile.uid, salesmanName: A.profile.name,
      type: A.saleType, items: A.cart.map(it => ({...it})),
      subtotal, discount, total, paid, due, paymentMethod: method, saleDate: new Date(),
    };
    A.cart = [];
    closeModal('cartModal');
    setTimeout(() => showInvoice(sale), 200);
    TP.toast('বিক্রয় সম্পন্ন!', 'success');
  } catch (err) {
    console.error(err);
    TP.toast(err.message || 'বিক্রয় ব্যর্থ', 'error');
    btn.disabled = false; btn.textContent = '✓ বিক্রয় সম্পন্ন';
  }
}

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${TP.esc(sale.invoiceNo)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>${css}</style></head><body>
    <div class="head"><h1>${TP.esc(st.shopName || A.profile.shop.shopName)}</h1>
      ${st.shopAddress ? `<p>${TP.esc(st.shopAddress)}</p>` : ''}
      ${st.shopPhone ? `<p>মোবাইল: ${TP.bn(st.shopPhone)}</p>` : ''}</div>
    <div class="meta"><div>
      <p><b>ইনভয়েস:</b> ${TP.esc(sale.invoiceNo)}</p>
      <p><b>তারিখ:</b> ${TP.bn(TP.fmtDate(sale.saleDate))}</p>
      <p><b>কাস্টমার:</b> ${TP.esc(sale.customerName)}</p>
      <p><b>সেলসম্যান:</b> ${TP.esc(sale.salesmanName)}</p></div></div>

    <div class="totals">
      <div><span>সাবটোটাল</span><span>${TP.money(sale.subtotal)}</span></div>

      <div><span>পরিশোধ</span><span>${TP.money(sale.paid)}</span></div>
      <div><span>বাকি</span><span>${TP.money(sale.due)}</span></div>

function printInvoice(sale, format) {
  const frame = document.getElementById('printFrame');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(invoiceDoc(sale, format)); doc.close();
  setTimeout(() => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch { TP.toast('প্রিন্ট করা যায়নি', 'error'); } }, 400);
}

/* ── PRODUCTS ── */
function renderProducts() {
  const el = document.getElementById('page-products');
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <button id="addProd" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold shadow-lg">+ নতুন প্রোডাক্ট</button>

        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-blue-500 focus:outline-none">
      <div id="prodList" class="space-y-2"></div>
    </div>`;
  const renderList = (q = '') => {
    const list = A.products.filter(p => !q || (p.name||'').toLowerCase().includes(q.toLowerCase()) || (p.barcode||'').includes(q));
    document.getElementById('prodList').innerHTML = list.length ? list.map(p => {
      const stock = +p.stockQty || 0;
      const low = stock <= (+p.lowStockAlert || 0);
      return `
        <div class="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100">
          <div class="font-semibold text-sm">${TP.esc(p.name)}</div>
          ${p.category ? `<div class="text-[10px] text-gray-400 mt-0.5">📁 ${TP.esc(p.category)}</div>` : ''}
          ${p.barcode ? `<div class="text-[10px] text-gray-500 font-mono mt-0.5">🏷️ #${TP.esc(p.barcode)}</div>` : ''}
          <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-gray-500 mt-1.5">
            <span>🏪 <b class="text-gray-700">${TP.money(p.retailPrice)}</b></span>
            <span>🏭 <b class="text-gray-700">${TP.money(p.wholesalePrice)}</b></span>
          </div>
          <div class="mt-1.5">
            <span class="inline-block px-2 py-0.5 rounded-md text-[11px] font-semibold
              ${stock<=0?'bg-red-100 text-red-600':low?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700'}">
              স্টক: ${TP.bn(stock)} ${TP.esc(p.unit||'')}
            </span>
          </div>
          <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100 flex-wrap">
            <button data-pqr="${p.id}" class="flex-1 min-w-[60px] bg-purple-50 text-purple-700 py-2 rounded-lg text-xs font-semibold">📱 QR</button>
            <button data-pstock="${p.id}" class="flex-1 min-w-[60px] bg-green-50 text-green-700 py-2 rounded-lg text-xs font-semibold">📦 স্টক</button>
            <button data-pedit="${p.id}" class="flex-1 min-w-[60px] bg-blue-50 text-blue-600 py-2 rounded-lg text-xs font-semibold">✏️ এডিট</button>
            <button data-pdel="${p.id}" class="px-3 bg-red-50 text-red-600 py-2 rounded-lg text-xs font-semibold">🗑</button>
          </div>
        </div>`;
    }).join('') : `<div class="bg-white rounded-xl p-8 text-center text-gray-400">কোনো প্রোডাক্ট নেই</div>`;

    document.querySelectorAll('[data-pedit]').forEach(b => b.addEventListener('click', () => openProductForm(b.dataset.pedit)));
    document.querySelectorAll('[data-pdel]').forEach(b => b.addEventListener('click', async () => {
      const p = A.products.find(x => x.id === b.dataset.pdel);
      if (!p) return;
      if (await TP.askConfirm(`"${p.name}" ডিলিট করবেন?`)) {
        await TP.db.collection('shops').doc(A.shopId).collection('products').doc(p.id).delete();
        TP.toast('ডিলিট হয়েছে', 'success');
      }
    }));
    document.querySelectorAll('[data-pstock]').forEach(b => b.addEventListener('click', () => {
      const p = A.products.find(x => x.id === b.dataset.pstock);
      if (!p) return;
      openForm(`স্টক যোগ — ${p.name}`,
        [
          { name: 'qty', label: `পরিমাণ (বর্তমান: ${TP.bn(p.stockQty)} ${p.unit||''})`, type: 'number', required: true, min: 0, step: '0.01', default: 10 },
          { name: 'note', label: 'নোট (ঐচ্ছিক)' },
        ], {}, async d => {
          const qty = +d.qty;
          if (!qty || qty <= 0) throw new Error('সঠিক পরিমাণ দিন');
          await TP.db.collection('shops').doc(A.shopId).collection('products').doc(p.id).update({ stockQty: (+p.stockQty||0) + qty });
          TP.toast(`${TP.bn(qty)} ${p.unit||''} স্টক যোগ`, 'success');
        });
    }));
    document.querySelectorAll('[data-pqr]').forEach(b => b.addEventListener('click', () => {
      const p = A.products.find(x => x.id === b.dataset.pqr);
      if (!p) return;
      if (!p.barcode) { TP.toast('এই প্রোডাক্টে বারকোড নেই', 'warn'); return; }
      showProductQRModal(p.name, p.barcode);
    }));
  };
  renderList();
  document.getElementById('prodSearch').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('addProd').addEventListener('click', () => openProductForm(null));
}

function openProductForm(id) {
  const p = id ? A.products.find(x => x.id === id) : null;
  const autoBarcode = p ? (p.barcode || '') : TP.generateBarcode();
  openForm(p ? 'প্রোডাক্ট এডিট' : 'নতুন প্রোডাক্ট',
    [
      { name: 'name', label: 'নাম', required: true },
      { name: 'category', label: 'ক্যাটাগরি', placeholder: 'যেমন: শার্ট, শাড়ি' },
      { name: 'barcode', label: '🏷️ বারকোড / QR (auto)', default: autoBarcode },
      { name: 'unit', label: 'একক', default: 'গজ' },
      { name: 'retailPrice', label: 'রিটেল দাম (৳)', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'wholesalePrice', label: 'হোলসেল দাম (৳)', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'stockQty', label: 'স্টক', type: 'number', step: '0.01', required: true, min: 0 },
      { name: 'lowStockAlert', label: 'লো স্টক সতর্কতা', type: 'number', step: '1', default: 5, min: 0 },
    ], p ? { ...p } : { barcode: autoBarcode },
    async d => {
      const ref = TP.db.collection('shops').doc(A.shopId).collection('products');
      const barcode = (d.barcode || '').trim() || autoBarcode;
      if (!p) {
        const dup = A.products.find(x => x.barcode === barcode);
        if (dup) throw new Error('এই বারকোড আগেই ব্যবহৃত: ' + barcode);
      }
      const body = {
        name: d.name.trim(), category: (d.category||'').trim(), barcode,
        unit: (d.unit||'').trim(), retailPrice: +d.retailPrice || 0,
        wholesalePrice: +d.wholesalePrice || 0, stockQty: +d.stockQty || 0,
        lowStockAlert: +d.lowStockAlert || 0,
      };
      if (p) await ref.doc(p.id).update(body);
      else await ref.add({ ...body, createdAt: TP.FV.serverTimestamp() });
      TP.toast('সেভ ✓ বারকোড: ' + barcode, 'success');
      setTimeout(() => showProductQRModal(d.name.trim(), barcode), 300);

}

    </div>`;
  document.body.appendChild(modal);

  TP.generateQRDataURL(barcode, 500).then(url => {
    document.getElementById('_prodQRImg').innerHTML = `
      <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:1px solid #e5e7eb">

  document.getElementById('_prodQRClose').onclick = () => modal.remove();

}

function openPaymentModal(custId) {
  const c = A.customers.find(x => x.id === custId);
  if (!c) return;
  openForm(`পেমেন্ট — ${c.name}`,
    [
      { name: 'amount', label: `পরিমাণ (বাকি: ${TP.money(c.due)})`, type: 'number', required: true, min: 1, default: c.due },
      { name: 'method', label: 'মেথড', type: 'select', options: [
        { value: 'cash', label: '💵 নগদ' }, { value: 'bkash', label: '📱 বিকাশ' },
        { value: 'upi', label: '💳 UPI' },
        { value: 'card', label: '💳 কার্ড' }, { value: 'bank', label: '🏦 ব্যাংক' }]},
      { name: 'note', label: 'নোট (ঐচ্ছিক)' },
    ], {}, async d => {
      const amt = +d.amount;
      if (!amt || amt <= 0) throw new Error('সঠিক পরিমাণ দিন');
      if (amt > (+c.due||0)) throw new Error('বাকির চেয়ে বেশি');
      const shopRef = TP.db.collection('shops').doc(A.shopId);
      const batch = TP.db.batch();
      batch.update(shopRef.collection('customers').doc(c.id), { due: (+c.due||0) - amt });
      batch.set(shopRef.collection('payments').doc(), {
        customerId: c.id, customerName: c.name, amount: amt, method: d.method,
        note: d.note || '', salesmanName: A.profile.name, paymentDate: TP.FV.serverTimestamp(),
      });
      await batch.commit();
      TP.toast(`${TP.money(amt)} গৃহীত`, 'success');
    });
}

/* ── REPORTS ── */
function renderReports() {
  const el = document.getElementById('page-reports');
  const periods = { today: 'আজ', week: '৭ দিন', month: '৩০ দিন', all: 'সব' };
  const getStart = () => {
    const now = new Date();
    if (A.reportPeriod === 'today') return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (A.reportPeriod === 'week')  return new Date(now.getTime() - 7*24*60*60*1000);
    if (A.reportPeriod === 'month') return new Date(now.getTime() - 30*24*60*60*1000);
    return new Date(0);
  };
  const start = getStart();
  const filtered = A.sales.filter(s => {
    const d = s.saleDate?.toDate ? s.saleDate.toDate() : new Date(s.saleDate);
    return d >= start;
  });
  const totalSales = filtered.reduce((a, s) => a + (+s.total||0), 0);
  const totalPaid  = filtered.reduce((a, s) => a + (+s.paid||0), 0);
  const totalDue   = filtered.reduce((a, s) => a + (+s.due||0), 0);
  const totalDisc  = filtered.reduce((a, s) => a + (+s.discount||0), 0);
  const productMap = {};
  filtered.forEach(s => s.items?.forEach(it => {
    if (!productMap[it.productId]) productMap[it.productId] = { name: it.name, qty: 0, total: 0 };
    productMap[it.productId].qty += +it.qty || 0;
    productMap[it.productId].total += (+it.qty||0) * (+it.price||0);
  }));
  const topProducts = Object.values(productMap).sort((a,b) => b.total - a.total).slice(0, 10);
  const salesmanMap = {};
  filtered.forEach(s => {
    if (!salesmanMap[s.salesmanId]) salesmanMap[s.salesmanId] = { name: s.salesmanName, count: 0, total: 0 };
    salesmanMap[s.salesmanId].count++;
    salesmanMap[s.salesmanId].total += +s.total || 0;
  });
  const topSalesmen = Object.values(salesmanMap).sort((a,b) => b.total - a.total);
  el.innerHTML = `
    <div class="p-3 space-y-3">
      <div class="flex gap-2 overflow-x-auto">

          <div class="text-[11px] text-gray-500">মোট বিক্রয়</div>
          <div class="text-xl font-extrabold text-blue-600 mt-1">${TP.money(totalSales)}</div>
          <div class="text-[10px] text-gray-400">${TP.bn(filtered.length)} লেনদেন</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div class="text-[11px] text-gray-500">আদায়</div>
          <div class="text-xl font-extrabold text-green-600 mt-1">${TP.money(totalPaid)}</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div class="text-[11px] text-gray-500">বাকি</div>
          <div class="text-xl font-extrabold text-red-600 mt-1">${TP.money(totalDue)}</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div class="text-[11px] text-gray-500">ডিসকাউন্ট</div>
          <div class="text-xl font-extrabold text-orange-500 mt-1">${TP.money(totalDisc)}</div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold mb-3">🏆 টপ প্রোডাক্ট</h3>
        ${topProducts.length ? topProducts.map((p, i) => `<div class="flex justify-between py-1.5 text-sm">
          <div><span class="text-gray-400 mr-2">${TP.bn(i+1)}.</span>${TP.esc(p.name)}</div>
          <div class="text-right"><div class="font-bold text-blue-600">${TP.money(p.total)}</div>
            <div class="text-[10px] text-gray-400">${TP.bn(p.qty)}</div></div>
        </div>`).join('') : '<div class="text-gray-400 text-sm">ডেটা নেই</div>'}
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="font-bold mb-3">👥 সেলসম্যান পারফরম্যান্স</h3>
        ${topSalesmen.length ? topSalesmen.map((s, i) => `<div class="flex justify-between py-1.5 text-sm">
          <div><span class="text-gray-400 mr-2">${TP.bn(i+1)}.</span>${TP.esc(s.name)}</div>
          <div class="text-right"><div class="font-bold text-blue-600">${TP.money(s.total)}</div>

      </div>
    </div>`;
  el.querySelectorAll('.period-btn').forEach(b => b.addEventListener('click', () => { A.reportPeriod = b.dataset.period; renderReports(); }));
}

    <div class="grid grid-cols-2 gap-2">

      <button id="btnStopScanner" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ ডিসকানেক্ট</button>

async function startScannerSession() {
  try {
    TP.toast('QR তৈরি হচ্ছে...', 'info');
    const sessionId = await TP.createScannerSession(A.shopId, A.profile.uid, A.profile.name, A.profile.shop?.shopName || '');
    A.scannerSessionId = sessionId;
    localStorage.setItem('tp_scanner_session', JSON.stringify({ sessionId, salesmanId: A.profile.uid }));
    setupScannerScanListener(sessionId);
    renderScannerSessionBox();
    showSessionQR(sessionId);
    TP.toast('QR তৈরি — স্ক্যান করুন', 'success');
  } catch (e) { console.error(e); TP.toast('সেশন তৈরি ব্যর্থ: ' + (e.message || ''), 'error'); }
}

async function stopScannerSession() {
  if (!A.scannerSessionId) return;
  if (!await TP.askConfirm('স্ক্যানার ডিসকানেক্ট করবেন?')) return;
  const sid = A.scannerSessionId;
  A.scannerSessionId = null;
  localStorage.removeItem('tp_scanner_session');
  if (A.scannerUnsub) { try { A.scannerUnsub(); } catch {} A.scannerUnsub = null; }
  await TP.deleteScannerSession(sid);
  renderScannerSessionBox();
  TP.toast('ডিসকানেক্টেড', 'success');
}

async function showSessionQR(sessionId) {
  const url = TP.buildScannerURL(sessionId);
  const old = document.getElementById('_scannerQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_scannerQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:'Noto Sans Bengali',sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">📱</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">স্ক্যানার ডিভাইস কানেক্ট</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">অন্য ফোনে QR স্ক্যান করুন</p>
      <div id="_sqrLoading" style="padding:30px;color:#6b7280">QR তৈরি হচ্ছে...</div>
      <div id="_sqrWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #2563eb">
          <img id="_sqrImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_sqrStatus" style="margin-top:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:10px;padding:8px;font-size:12px;color:#1e40af;font-weight:600">⏳ স্ক্যানার ডিভাইসের অপেক্ষায়...</div>
        <div style="margin-top:10px;font-size:10px;color:#9ca3af;font-family:monospace;word-break:break-all;line-height:1.4">${TP.esc(url)}</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_sqrCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 URL কপি</button>
        <button id="_sqrClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">বন্ধ</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const dataURL = await TP.generateQRDataURL(url, 600);
    document.getElementById('_sqrLoading').style.display = 'none';
    document.getElementById('_sqrWrap').style.display = '';
    document.getElementById('_sqrImg').src = dataURL;
  } catch (e) { document.getElementById('_sqrLoading').textContent = '⚠️ QR তৈরি হয়নি'; }
  const unsub = TP.db.collection('scannerSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_sqrStatus');
    if (el && d.scannerConnected) { el.style.background = '#dbeafe'; el.style.color = '#1e40af'; el.innerHTML = '✅ স্ক্যানার ডিভাইস কানেক্টেড!'; }
  });
  document.getElementById('_sqrCopy').onclick = async () => { await TP.copyText(url); TP.toast('কপি হয়েছে', 'success'); };
  document.getElementById('_sqrClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

function setupScannerScanListener(sessionId) {
  if (A.scannerUnsub) { try { A.scannerUnsub(); } catch {} A.scannerUnsub = null; }
  A.scannerUnsub = TP.db.collection('scannerSessions').doc(sessionId).collection('scans')
    .where('processed', '==', false).onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type !== 'added') return;
        const data = change.doc.data();
        const code = String(data.barcode || '').trim();
        if (!code) return;
        const product = A.products.find(p => String(p.barcode || '').trim() === code);
        if (product) {
          if ((+product.stockQty || 0) <= 0) TP.toast('📱 ' + product.name + ' — স্টক শেষ!', 'error');
          else { addToCart(product.id); TP.toast('📱 ' + product.name + ' যোগ হয়েছে', 'success'); if (A.currentPage !== 'pos') goTo('pos'); }
        } else TP.toast('📱 বারকোড পাওয়া যায়নি: ' + code, 'error');
        change.doc.ref.delete().catch(() => {});
      });
    }, err => console.error('scan listener:', err));
}

async function restoreScannerSession() {
  try {
    const raw = localStorage.getItem('tp_scanner_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== A.profile.uid) { localStorage.removeItem('tp_scanner_session'); return; }
    const doc = await TP.db.collection('scannerSessions').doc(s.sessionId).get();
    if (!doc.exists) { localStorage.removeItem('tp_scanner_session'); return; }
    A.scannerSessionId = s.sessionId;
    setupScannerScanListener(s.sessionId);
  } catch (e) { console.error(e); }
}

  box.innerHTML = `
    <div class="bg-blue-50 border border-blue-300 rounded-xl p-3 mb-3">
      <div class="flex items-center gap-2 mb-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 pulse"></span>
        <span class="font-bold text-sm text-blue-700">সেশন চালু</span></div>
      <div class="text-[11px] text-gray-600 font-mono break-all mb-2">${TP.esc(A.paymentSessionId)}</div>
      <div class="text-[11px] text-gray-500">POS এ UPI select করলে ওই ডিভাইসে QR দেখাবে</div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button id="btnShowPayQR" class="bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:scale-95">📱 QR দেখান</button>
      <button id="btnStopPayment" class="bg-red-50 text-red-600 py-3 rounded-xl font-semibold text-sm active:scale-95">⛔ ডিসকানেক্ট</button>
    </div>`;
  document.getElementById('btnShowPayQR').addEventListener('click', () => showPaymentQR(A.paymentSessionId));
  document.getElementById('btnStopPayment').addEventListener('click', stopPaymentDevice);
}

async function startPaymentDevice() {
  try {
    const s = A.profile.shop.settings || {};
    if (!s.upiId) { TP.toast('আগে UPI ID সেভ করুন', 'error'); return; }
    TP.toast('QR তৈরি হচ্ছে...', 'info');
    const sessionId = await TP.createPaymentSession(A.shopId, A.profile.uid, A.profile.name,
      s.shopName || A.profile.shop.shopName, s.upiId, s.upiName || '');
    A.paymentSessionId = sessionId;
    localStorage.setItem('tp_payment_session', JSON.stringify({ sessionId, salesmanId: A.profile.uid }));
    renderPaymentDeviceBox();
    showPaymentQR(sessionId);
    TP.toast('Payment ডিভাইস রেডি', 'success');
  } catch (e) { console.error(e); TP.toast('সেশন তৈরি ব্যর্থ: ' + e.message, 'error'); }
}

async function stopPaymentDevice() {
  if (!A.paymentSessionId) return;
  if (!await TP.askConfirm('Payment ডিভাইস ডিসকানেক্ট করবেন?')) return;
  const sid = A.paymentSessionId;
  A.paymentSessionId = null;
  localStorage.removeItem('tp_payment_session');
  await TP.deletePaymentSession(sid);
  renderPaymentDeviceBox();
  TP.toast('ডিসকানেক্টেড', 'success');
}

async function showPaymentQR(sessionId) {
  const url = TP.buildPaymentURL(sessionId);
  const old = document.getElementById('_payQRModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = '_payQRModal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:'Noto Sans Bengali',sans-serif;overflow-y:auto`;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center">
      <div style="font-size:38px;margin-bottom:4px">💳</div>
      <h3 style="font-weight:800;font-size:18px;margin:0 0 4px">Payment ডিভাইস কানেক্ট</h3>
      <p style="color:#6b7280;font-size:12px;margin:0 0 14px">অন্য ফোনে QR স্ক্যান করুন</p>
      <div id="_payQRLoad" style="padding:30px;color:#6b7280">QR তৈরি হচ্ছে...</div>
      <div id="_payQRWrap" style="display:none">
        <div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid #2563eb">
          <img id="_payQRImg" style="width:240px;height:240px;display:block">
        </div>
        <div id="_payQRStatus" style="margin-top:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:10px;padding:8px;font-size:12px;color:#1e40af;font-weight:600">⏳ ডিভাইসের অপেক্ষায়...</div>
        <div style="margin-top:10px;font-size:10px;color:#9ca3af;font-family:monospace;word-break:break-all;line-height:1.4">${TP.esc(url)}</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="_payQRCopy" style="flex:1;background:#2563eb;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">📋 URL কপি</button>
        <button id="_payQRClose" style="flex:1;background:#f3f4f6;color:#374151;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">বন্ধ</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const qr = await TP.generateQRDataURL(url, 600);
    document.getElementById('_payQRLoad').style.display = 'none';
    document.getElementById('_payQRWrap').style.display = '';
    document.getElementById('_payQRImg').src = qr;
  } catch (e) { document.getElementById('_payQRLoad').textContent = '⚠️ QR তৈরি হয়নি'; }
  const unsub = TP.db.collection('paymentSessions').doc(sessionId).onSnapshot(snap => {
    if (!snap.exists) { unsub(); modal.remove(); return; }
    const d = snap.data();
    const el = document.getElementById('_payQRStatus');
    if (el && d.deviceConnected) { el.style.background = '#dbeafe'; el.style.color = '#1e40af'; el.innerHTML = '✅ ডিভাইস কানেক্টেড!'; }
  });
  document.getElementById('_payQRCopy').onclick = async () => { await TP.copyText(url); TP.toast('কপি হয়েছে', 'success'); };
  document.getElementById('_payQRClose').onclick = () => { unsub(); modal.remove(); };
  modal.addEventListener('click', e => { if (e.target === modal) { unsub(); modal.remove(); } });
}

function restorePaymentSession() {
  try {
    const raw = localStorage.getItem('tp_payment_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.salesmanId !== A.profile.uid) { localStorage.removeItem('tp_payment_session'); return; }
    // Async check
    (async () => {
      try {
        const doc = await TP.db.collection('paymentSessions').doc(s.sessionId).get();
        if (!doc.exists) { localStorage.removeItem('tp_payment_session'); return; }
        A.paymentSessionId = s.sessionId;
        if (A.currentPage === 'settings') renderSettings();
      } catch {}
    })();
  } catch (e) { console.error(e); }
}

window.goTo = goTo;
</script>
</body>
</html>
